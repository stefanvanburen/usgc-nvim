name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stylua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ contrib/

  load-colorschemes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      - name: Load each colorscheme in headless Neovim
        run: |
          set -e
          for f in colors/*.vim; do
            name=$(basename "$f" .vim)
            echo "Loading $name"
            nvim --headless -u NONE --cmd "set rtp+=." -c "colorscheme $name" -c "qa"
          done
      - name: Generate the terminal themes
        run: |
          set -e
          # One theme per variant, so a silently empty run fails here.
          count=$(ls -1 colors/usgc-*.vim | wc -l)
          nvim -l contrib/ghostty.lua "$RUNNER_TEMP/ghostty"
          test "$(ls -1 "$RUNNER_TEMP/ghostty" | wc -l)" -eq "$count"
          nvim -l contrib/fish.lua "$RUNNER_TEMP/fish"
          test "$(ls -1 "$RUNNER_TEMP/fish" | wc -l)" -eq "$count"
